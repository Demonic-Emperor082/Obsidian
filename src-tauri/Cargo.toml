[package]
name = "app"
version = "0.1.0"
description = "Obsidian Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tauri = { version = "2.2", features = ["tray-icon"] }
discord-rich-presence = "0.2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
sysinfo = "0.30"
dirs-next = "2.0"
libloading = "0.8"
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_UI_Shell"] }
urlencoding = "2.1"
zip = "0.6"
