<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fffd4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="#0a0a0a"/>

  <!-- Glow backdrop -->
  <circle cx="128" cy="128" r="100" fill="url(#glow)"/>

  <!-- Outer ring — full circle, dim -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#7fffd4" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Left half-moon (filled) -->
  <path d="M128 44 A84 84 0 0 0 128 212 Z" fill="#7fffd4" opacity="0.9" filter="url(#blur-glow)"/>

  <!-- Right half — just the arc stroke -->
  <path d="M128 44 A84 84 0 0 1 128 212" fill="none" stroke="#7fffd4" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Inner glow line on the flat edge -->
  <line x1="128" y1="44" x2="128" y2="212" stroke="#7fffd4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Small accent dot top -->
  <circle cx="128" cy="38" r="4" fill="#7fffd4" opacity="0.7"/>
  <!-- Small accent dot bottom -->
  <circle cx="128" cy="218" r="4" fill="#7fffd4" opacity="0.7"/>

  <!-- Outer subtle ring -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#7fffd4" stroke-width="1" stroke-opacity="0.07"/>
</svg>
